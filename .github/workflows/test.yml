---
name: CI Test
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/seacloud-lab/seasearch-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    env:
      ZINC_ENABLE_TEXT_KEYWORD_MAPPING: true

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true
      - run: go test ./...
