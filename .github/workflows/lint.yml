---
name: CI Lint
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  lint:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/seafileltd/seasearch-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          check-latest: true
      - uses: golangci/golangci-lint-action@v9
